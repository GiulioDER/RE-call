services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall
    volumes:
      - recall_pgdata:/var/lib/postgresql
    ports:
      # Loopback ONLY. A bare "5432:5432" binds 0.0.0.0, which publishes this database, with the
      # development credentials above, to every machine on the network. Docker's published ports
      # are enforced in the DOCKER iptables chain ahead of INPUT, so a host firewall does not
      # block them. Nothing needs off-host access: the wizard and the CLI connect over localhost,
      # and a service inside the compose network reaches `db:5432` without any published port.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  recall_pgdata:
