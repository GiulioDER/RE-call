x-answer-provider-environment: &answer-provider-environment
  RECALL_REASONING_ANSWER_ENABLED: "1"
  RECALL_REASONING_ANSWER_PROVIDER: openrouter
  RECALL_REASONING_ANSWER_MODEL: deepseek/deepseek-v4-flash
  RECALL_REASONING_ANSWER_API_KEY: ${OPENROUTER_API_KEY:-}
  RECALL_REASONING_ANSWER_BASE_URL: https://openrouter.ai/api/v1
  RECALL_REASONING_ANSWER_CONTEXT_TOKENS: "1024"
  RECALL_REASONING_ANSWER_TIMEOUT: "120"
  RECALL_REASONING_ANSWER_MAX_TOKENS: "512"
  RECALL_REASONING_ANSWER_REASONING_EFFORT: ${RECALL_REASONING_ANSWER_REASONING_EFFORT:-none}

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall
    volumes:
      - recall_desktop_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall"]
      interval: 2s
      timeout: 3s
      retries: 30

  recall-docs:
    image: recall-desktop-recall:local
    build:
      context: .
      dockerfile: docker/desktop/Dockerfile
    command: ["sleep", "infinity"]
    volumes:
      - recall_desktop_uploads:/opt/recall/uploads
    environment:
      <<: *answer-provider-environment
      RECALL_ENV: development
      RECALL_DSN: postgresql://recall:recall@db:5432/recall
      RECALL_MIGRATION_DSN: postgresql://recall:recall@db:5432/recall
      RECALL_EMBEDDER: fastembed
      RECALL_TRUST_MODE: development
      RECALL_ALLOW_INSECURE_DSN: "1"
      RECALL_TENANT: default-docs
    depends_on:
      db:
        condition: service_healthy

  recall-code:
    image: recall-desktop-recall:local
    command: ["sleep", "infinity"]
    volumes:
      - recall_desktop_uploads:/opt/recall/uploads
    environment:
      <<: *answer-provider-environment
      RECALL_ENV: development
      RECALL_DSN: postgresql://recall:recall@db:5432/recall
      RECALL_MIGRATION_DSN: postgresql://recall:recall@db:5432/recall
      RECALL_EMBEDDER: fastembed
      RECALL_TRUST_MODE: development
      RECALL_ALLOW_INSECURE_DSN: "1"
      RECALL_TENANT: default-code
    depends_on:
      db:
        condition: service_healthy

  recall-user-docs:
    image: recall-desktop-recall:local
    command: ["sleep", "infinity"]
    volumes:
      - recall_desktop_uploads:/opt/recall/uploads
    environment:
      <<: *answer-provider-environment
      RECALL_ENV: development
      RECALL_DSN: postgresql://recall:recall@db:5432/recall
      RECALL_MIGRATION_DSN: postgresql://recall:recall@db:5432/recall
      RECALL_EMBEDDER: fastembed
      RECALL_TRUST_MODE: development
      RECALL_ALLOW_INSECURE_DSN: "1"
      RECALL_TENANT: user-docs
    depends_on:
      db:
        condition: service_healthy

  recall-user-code:
    image: recall-desktop-recall:local
    command: ["sleep", "infinity"]
    volumes:
      - recall_desktop_uploads:/opt/recall/uploads
    environment:
      <<: *answer-provider-environment
      RECALL_ENV: development
      RECALL_DSN: postgresql://recall:recall@db:5432/recall
      RECALL_MIGRATION_DSN: postgresql://recall:recall@db:5432/recall
      RECALL_EMBEDDER: fastembed
      RECALL_TRUST_MODE: development
      RECALL_ALLOW_INSECURE_DSN: "1"
      RECALL_TENANT: user-code
    depends_on:
      db:
        condition: service_healthy

volumes:
  recall_desktop_pgdata:
  recall_desktop_uploads:
