[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name is `recall-rag`; import name is `recall`. See docs/DEPENDENCIES.md.
name = "recall-rag"
version = "0.12.0"
description = "Trustworthy retrieval for an AI agent's own memory — verdict, confidence and provenance per hit, or an explicit abstention"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Giulio D'Erme" }]
keywords = [
    "rag", "retrieval-augmented-generation", "agent-memory", "memory", "long-term-memory",
    "ai-agents", "semantic-search", "claude", "pgvector", "postgresql",
    "hybrid-search", "vector-search", "reranking", "mcp", "model-context-protocol",
    "abstention", "calibration", "llm-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

dependencies = [
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.4",
    # `recall_mcp.service` and `recall_mcp.models` import pydantic AT MODULE LOAD, and
    # `recall_agent` (shipped in the wheel, importable with no extras) imports that service layer.
    # It used to arrive only as a transitive of `mcp`, so a plain `pip install recall-rag` then
    # `import recall_agent` raised ModuleNotFoundError: pydantic. Relying on somebody else's
    # transitive for a module-scope import is a dependency whether or not it is declared.
    "pydantic>=2",
]

[project.optional-dependencies]
# <1 rather than unbounded, and the reason is narrower than "majors can break".
# `recall.embeddings.embedder_artifact_path` reaches `embedder._model.model._model_dir`, a PRIVATE
# attribute chain, because a model's own snapshot directory is the only thing worth hashing: the
# shared cache holds every model ever downloaded and its digest would identify nothing. That
# function is deliberately defensive and returns `None` when the chain cannot be walked, so a
# fastembed release that renames it does NOT raise. It makes `embedder_artifact_digest` return
# `None`, which makes the pipeline identity unverified, which makes production generation builds
# refuse — an install that silently stops being able to accept uploads, with nothing pointing at
# the dependency that changed.
# Verified reachable on fastembed 0.8.0 (2026-08-20): digest dcc52dedc73755de..., production
# upload possible. Re-check with `recall.embeddings.embedder_artifact_digest(resolve_embedder(
# "fastembed"))` before raising this bound.
fastembed = ["fastembed>=0.3,<1"]
# ⛔ Ragas is deliberately NOT declared as an extra, and this is a security decision.
#
# PYSEC-2026-3046 / GHSA-95ww-475f-pr4f (SSRF via the multi-modal faithfulness module)
# affects 0.2.3 through 0.4.3, and 0.4.3 is the LATEST release: there is no fixed version
# to pin to. Declaring it here would ship a known-vulnerable dependency, with no fixed
# version to move to, into every install of this package. That is reason enough on its
# own: the scorer is a benchmarking tool, and nobody installing this package needs it.
# It therefore runs in its own interpreter, and `scripts/agent_ab_score_ragas.py` carries
# the install command for that venv.
#
# 🔁 Corrected 2026-08-23. This used to add "to no purpose, because Ragas cannot run on
# this project's Python anyway: pyarrow.parquet has no cp314 wheel". False in both halves.
# pyarrow 22.0.0, 23.0.1, 24.0.0, 25.0.0 and 25.0.1 all publish a plain cp314 wheel, and
# 25.0.1 imports fine here. Do not restore that clause: it made a security decision look
# like a free one, so the day the convenience argument expired the whole rationale would
# have read as expired with it. The security argument has to carry this alone, and does.
#
# The benchmark never reaches the vulnerable path: it uses AnswerCorrectness and
# FactualCorrectness, not the multi-modal collections module. That is a reason the tool is
# safe to USE in an isolated venv, not a reason to ship it as a dependency.
# The paired A/B harness. scipy carries ONLY the Wilcoxon test for the continuous cost
# metrics; the primary binary endpoint uses an exact binomial written in the standard
# library, so the headline result needs nothing from this extra.
agent-ab = ["scipy>=1.11"]
# Native extraction for PDF, Office, spreadsheets, presentations, HTML, and tables.
documents = [
    # pypdf is capped at the major ON PURPOSE, and the reason is silence rather than breakage.
    # Its output is extracted TEXT, which feeds chunking and therefore what the corpus contains:
    # a major that changes layout handling or whitespace does not raise, it quietly re-chunks
    # every PDF-derived document and moves embeddings that nothing re-verifies. So a major is a
    # re-index-and-compare, not a resolver decision. Capped 2026-09-02 as a deliberate guard, NOT
    # on evidence of a specific break; 6.16.1 resolves unchanged under it. `.github/dependabot.yml`
    # carries the matching ignore rule and must lose it in the same change if this cap is lifted.
    "pypdf>=5.0,<7",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "xlrd>=2.0",
    "beautifulsoup4>=4.12",
    "python-oxmsg>=0.0.2",
]
# Pooling is optional for CLI use and required for server processes.
pool = ["psycopg-pool>=3.2"]
# Keep `mcp`, `dev` and `desktop` in step. Version rationale lives in docs/DEPENDENCIES.md.
# PINNED EXACTLY, not ranged, as of 2026-08-25. The old `>=2,<3` let 2.1.0 arrive on its own and
# it redacts a tool exception's message unless the exception derives from the SDK's `ToolError`,
# so the rate limiter's actionable retry guidance reached clients as "Error executing tool
# recall_search". That broke master three times (#497, #498, #499) before the cause was found,
# and CI installs with `pip install -e`, which ignores uv.lock, so the lock did not stop it.
# `recall_mcp.limits.RateLimited` carries the `ToolError` base to survive this; the pin is what
# makes the next such change arrive as a deliberate bump with a test run behind it.
mcp = ["mcp==2.1.0", "psycopg-pool>=3.2", "PyJWT[crypto]>=2.10.1,<3"]
# >=0.2.2 rather than >=0.2: `max_retries` first appears on `voyageai.Client` in 0.2.2, and
# `VoyageEmbedder` passes it to keep this repository's retry policy single-owner. 0.2.1 satisfies
# ">=0.2", is still installable, and its client takes `api_key` and nothing else, so construction
# would raise TypeError before the dim probe on an environment that already had it.
voyage = ["voyageai>=0.2.2"]
# OpenAI-compatible embeddings, including OpenRouter-hosted models.
openai = ["openai>=1.0"]
s3 = ["boto3>=1.35"]
# Learned sparse retrieval uses transformers directly. Model weights are user-provisioned.
sparse = ["transformers>=4.40,<6", "torch>=2.0,<3"]
# Keep rerank, entail, and finetune sentence-transformers floors in step.
rerank = ["sentence-transformers>=3.0"]
entail = ["sentence-transformers>=3.0"]
eval = ["matplotlib>=3.7", "numpy"]
# Model backed truth extraction. Runs on the ingest path only, never the query path, and is
# OFF unless RECALL_TRUTH_EXTRACTION is set. Shares the `bench` extra's openai floor.
extract = ["openai>=1.0"]
finetune = ["sentence-transformers>=3.0", "datasets>=2.0", "accelerate>=1.1", "numpy"]
# Adapter extras depend on the core packages only, not the framework meta-packages.
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.11"]
# Claude Agent SDK integration (`recall_agent`). Deliberately NOT in `dev`: the SDK spawns the
# Claude Code CLI at runtime, CI installs without heavy extras, and a CI run without the SDK is
# what proves every `recall_agent` module imports and its contract tests pass with the extra
# absent — the same arrangement the fastembed suite uses. Floor 0.2 because the
# `ClaudeAgentOptions` surface this package relies on (`setting_sources`, `extra_args`,
# `cli_path`, SDK in-process servers in `mcp_servers`) is the 0.2 line's; `<1` because the SDK
# is pre-1.0 and `recall_agent/_sdk.py` is deliberately the only module exposed to its churn.
agent = ["claude-agent-sdk>=0.2,<1"]
# Benchmark extra is deliberate and excluded from `dev`.
bench = ["mem0ai==2.0.13", "openai>=1.0", "pyarrow>=15", "numpy>=1.26", "tiktoken==0.14.0"]
dev = [
    "pytest>=8", "pytest-timeout>=2.3", "pytest-cov>=5", "ruff>=0.16,<0.17",
    # `pytest-xdist` is a dev tool, not a test dependency: nothing imports it and the suite runs
    # identically without it. It is declared because the suite is LARGE rather than slow — 6,563
    # tests averaging under a third of a second each, with no hotspot to remove — so the only
    # lever on its wall clock is running it in parallel. `tests/conftest.py::_isolate_xdist_worker`
    # is what makes that safe against a shared database; see the note there.
    "pytest-xdist>=3.6",
    "mcp==2.1.0", "psycopg-pool>=3.2",
    "python-dotenv>=1.0",
    "PyJWT[crypto]>=2.10.1,<3",
    "langchain-core>=0.3",
    "llama-index-core>=0.11",
]
# Optional Windows desktop shell. Keeping this separate preserves the small library install.
desktop = ["PySide6>=6.7", "keyring>=25", "mcp==2.1.0", "fastembed>=0.3,<1"]

# Declared LAST among the `[project]` sub-tables: every bare key above (`dependencies`,
# `classifiers`, …) belongs to `[project]`, and opening a sub-table earlier would silently
# reparent whatever followed it.
[project.urls]
Homepage = "https://github.com/GiulioDER/RE-call"
Documentation = "https://giulioder.github.io/RE-call/"
Source = "https://github.com/GiulioDER/RE-call"
Issues = "https://github.com/GiulioDER/RE-call/issues"
Changelog = "https://github.com/GiulioDER/RE-call/blob/master/CHANGELOG.md"
"Evaluation findings" = "https://github.com/GiulioDER/RE-call/blob/master/results/FINDINGS.md"
"Security policy" = "https://github.com/GiulioDER/RE-call/blob/master/SECURITY.md"

[project.scripts]
recall = "recall.cli:main"
recall-enterprise = "recall.enterprise_cli:main"
recall-mcp = "recall_mcp.server:main"
# The session hooks, as a script rather than only as `python -m recall_hooks`.
#
# ⚠️ This exists so the Claude Code PLUGIN can invoke them. A plugin's `hooks.json` is written
# once and shipped to every user, so it cannot name an interpreter: `recall.claude_code`
# hardcodes `sys.executable` at install time precisely because it knows the machine, and a plugin
# never does. Bare `python` is not a substitute, since it resolves to whatever is first on PATH,
# which on a machine with a venv is routinely an interpreter recall is not installed into.
# A console script is placed beside `recall` and `recall-mcp` by the same installer, so if one of
# those resolves this one does too.
recall-hooks = "recall_hooks:main"
recall-codex-hooks = "recall_hooks.codex:main"
recall-codex-mcp = "recall_mcp.codex_server:main"
recall-desktop = "recall.desktop.main:main"
# The graphical installer. A separate script rather than a flag on `recall-desktop`, because the
# person who needs it does not have an install yet and therefore has nothing for that app to open.
recall-install = "recall.desktop.main:install_main"
# The uninstaller has a window too, because the person who needed a graphical installer is the same
# person a year later, and `recall uninstall --data-root ...` is not a thing they will type.
recall-uninstall = "recall.desktop.main:uninstall_main"

[tool.hatch.build.targets.wheel]
packages = ["recall", "recall_hooks", "recall_mcp", "recall_agent"]

artifacts = ["recall/py.typed", "recall_mcp/py.typed", "recall_agent/py.typed"]
# recall/eval ships only its load-bearing slice: calibrate/metrics (the wizard's calibration),
# labelled and its deps (a documented CLI), synthetic/vocab (query generation), and the sample
# corpus + labels the README points the wizard at. The one-off benchmark drivers and session
# scripts below are repo-only, like recall_interop — they never worked from a wheel (several
# index relative clone paths) and 671K of research artifacts does not belong in an install.
# recall/wizard/llm.py is a preregistered experiment arm imported by nothing but its own test
# (docs/preregistrations/2026-08-16-generated-calibration-query-sets.md); it stays out of the
# wheel until that experiment resolves.
exclude = [
  "recall/eval/reasoning_session*",
  "recall/eval/locomo*.py",
  "recall/eval/longmemeval*.py",
  "recall/eval/beir.py",
  "recall/eval/gap_run.py",
  "recall/eval/gap_study.py",
  "recall/eval/hostload.py",
  "recall/eval/scale.py",
  "recall/eval/cosine_dump.py",
  "recall/eval/_show_ids.py",
  "recall/eval/arm_check.py",
  "recall/eval/resume.py",
  "recall/eval/harness.py",
  "recall/eval/__main__.py",
  "recall/eval/promotion",
  "recall/eval/provenance.py",
  "recall/eval/near_miss.json",
  "recall/eval/peps_questions.json",
  "recall/eval/peps_trust_queries.json",
  "recall/wizard/llm.py",
]

# The skills ship in the WHEEL too, not only in the Claude plugin.
#
# `plugin/skills/` is where Claude Code's plugin loader looks and cannot move, and `plugin/` is not
# a package, so before this a pip install carried no skills at all: `recall setup` could only print
# the plugin install lines and hope. Force-including a copy under the package makes the pip path
# self-sufficient, and `recall.claude_code._SKILL_ROOTS` reads whichever layout is present, with a
# checkout's copy winning so an editable install tests what it is editing.
[tool.hatch.build.targets.wheel.force-include]
"plugin/skills" = "recall/_skills"
"codex-plugin/.codex-plugin" = "recall/_codex_plugin/.codex-plugin"
"codex-plugin/hooks" = "recall/_codex_plugin/hooks"
"codex-plugin/.mcp.json" = "recall/_codex_plugin/.mcp.json"
"codex-plugin/skills" = "recall/_codex_plugin/skills"

[tool.pytest.ini_options]
# `pytest-timeout` was a declared dependency with nothing configuring it, which made it inert:
# the comment beside it in `[project.optional-dependencies].dev` explains that a test which
# fails to terminate "reads as 'still running', not as a regression", and that was exactly the
# state the suite was in. CI runs `pytest -q -n auto` (bare `pytest -q` until 2026-08-23), so a
# hang burned the job's full timeout instead of failing; under `-n` it is reported as `node down`
# instead, which is easier to read and just as fatal. 120s is far above the slowest single test
# and far below anything anyone would wait for; a test with a legitimate reason to take longer can
# raise its own with `@pytest.mark.timeout(n)`, as the four `voyageai_sdk` tests do and as
# `test_hnsw_filtered_recall.py` does at 300s for its 105.7s of module setup, which is therefore
# NOT relying on the headroom here.
#
# 🔁 Corrected 2026-08-23, over a correction landed the same week. This said "30 to 40 minutes at
# 6,088 tests", which was measured on 2026-08-20 and was true serially. The suite now runs in
# parallel: measured 2026-08-23 at 6,599 tests, **49:58 serial and 14:05 at `-n 4`**. Re-measure,
# and get the breakdown rather than the number alone:
#
#   python -m pytest tests/ -q -n 4 --durations=30
#
# `thread` rather than `signal`: signal-based timeouts do not work on Windows, and this suite is
# developed there and run on Linux in CI.
timeout = 120
timeout_method = "thread"
markers = [
  "benchharness: benchmark-harness coverage rather than product coverage; deselect with -m 'not benchharness' for a product-only run",
]

# Collect ONLY `tests/`. Two analysis scripts under `results/` are named `paired_rerank_test.py`
# ("paired rerank test" as in the statistical test, not a unit test); neither defines a single
# test function. Bare `pytest -q` picked them up anyway, and because they share a basename with
# no package `__init__.py` between them, pytest could not give them distinct module names and
# aborted the ENTIRE run with a collection error — so two files that contain no tests could turn
# the whole suite red. Every real test in this repository lives in `tests/`; verified by
# searching for `test_*.py` / `*_test.py` outside it and finding only those two.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The agent-benchmark fixtures are INPUT, not source. `benchmarks/agent_ab/workspaces/` holds the
# repository states restored into each sandbox, and one of them is a lint control whose whole
# design is that three files are lint-clean but unformatted while a fourth fails `ruff check`: the
# tree is how the checker tells which tool the agent reached for. Linting them here would either
# fail CI or force a fix that destroys the measurement. Excluded rather than noqa'd, because the
# noqa comments would themselves be visible to the agent being measured.
#
# `benchmarks/atm_full_run.py` and `benchmarks/atm_bench.py` are FROZEN ARTIFACTS, not maintained
# source. They are byte-identical to the code that produced the published ATM-Bench run, and that
# is their entire value: the leaderboard submission points at them as the reproduction pointer, so
# a lint fix would quietly make the published harness a different program from the one that ran.
# They arrive with 8 findings (six `E402`, two `F841`), all of them stylistic and none of them
# reachable as a defect. Excluded rather than `noqa`'d, because a `noqa` comment is itself an edit
# to the bytes this repository promises are frozen.
# `tests/test_atm_runner_published.py` pins both files by SHA-256, so removing them from this list
# fails a test with the reason rather than producing a silent lint failure.
extend-exclude = [
    "benchmarks/agent_ab/workspaces",
    "benchmarks/agent_ab/oracles",
    "benchmarks/atm_full_run.py",
    "benchmarks/atm_bench.py",
]

[tool.ruff.lint]
# Ruff 0.16 expands the implicit default rule set from 59 rules to 413. RE-call keeps the previous
# baseline explicit here so upgrading the binary is not also a repository-wide style rewrite.
#
# `S` is flake8-bandit, added 2026-08-26 after a security audit found the repository carried
# `# noqa: S310`, `# noqa: S603` and `# noqa: S608` markers while `S` was NOT selected. Those
# comments were inert: they read as "somebody considered this and cleared it" and were enforcing
# nothing, which is worse than an absent check because it answers the question a reviewer would
# otherwise ask.
#
# What turning it on actually buys, stated honestly: the 28 highest-severity rules in the set
# (S102, S307, S301, S302, S506 for code execution and unsafe deserialization, S601/S602 for shell
# injection, plus the weak-cipher and cleartext-protocol rules) find ZERO across this repository
# today, so the gate costs nothing now and refuses the day somebody adds the first one. That is the
# whole value: it is a ratchet, not a cleanup.
select = ["E4", "E7", "E9", "F", "S"]

# Rules excluded with the reason, rather than a bare list. Each was measured across the repository
# on 2026-08-26; re-measure any of them with `python -m ruff check --select S### --statistics .`
ignore = [
    # 10,662 hits, 10,603 of them under `tests/`. `assert` IS pytest's assertion mechanism, so the
    # rule is measuring the test framework rather than this code. The 24 in shipped packages are a
    # real (small) question, but they are a `python -O` argument rather than a security one, and
    # `recall_mcp/server.py` already makes that argument explicitly where it matters.
    "S101",
    # 83 hits, every one a seeded sampler in the eval and benchmark harnesses, where
    # reproducibility is the requirement and unpredictability would be a defect. No security
    # decision in this package consumes `random`; `recall_mcp/auth.py` uses `secrets`.
    "S311",
    # 74 and 40 hits. Every `subprocess` call site in this repository passes an argv LIST, and
    # `shell=True` appears nowhere (verified: `grep -rn "shell=True" --include=*.py` is empty).
    # S607's partial names (`docker`, `git`, `soffice`) are deliberate: resolving them from PATH is
    # how the wizard finds a user's own installation.
    "S603", "S607",
    # 23 and 6 hits, all best-effort cleanup where the failure genuinely does not matter and the
    # surrounding comment says so. A style rule wearing a security number.
    "S110", "S112",
    # 17 hits, 14 of them scratch paths in `results/`. Not a shipped-code pattern.
    "S108",
    # 17 hits. `urlopen` honours `file:` and custom schemes, so the rule is asking "could this URL
    # name something other than a web resource?". Reviewed site by site on 2026-08-26 rather than
    # waved through, and the answer divides cleanly:
    #
    #   - BUILT IN CODE from a fixed `https://` prefix, so the scheme is not reachable by input:
    #     `recall/desktop/github.py`, `recall/desktop/updates.py`.
    #   - OPERATOR-CONFIGURED endpoints from environment variables (`recall/answer_provider.py`,
    #     `recall/wizard/llm.py`, `recall_mcp/translation.py`). An operator who can set the
    #     endpoint can already run code in the process; the scheme is not the boundary.
    #   - HARNESS code under `benchmarks/`, `scripts/` and `docs/`, not shipped behaviour.
    #
    # The one site whose URL came from a DATA FILE was `tools/prior_art/cli.py`, and that one was
    # fixed rather than excused: it now refuses a non-http(s) scheme before opening.
    #
    # ⚠️ Recorded as DEBT, not as a clean bill. Ignoring the rule globally means a future
    # `urlopen` on an attacker-supplied URL will not be caught here. The durable fix is a single
    # checked fetch helper (`recall_mcp/oidc.py::_http_get` is the shape: refuse non-https, refuse
    # redirects, cap the body) that these call sites route through, which is a larger change than
    # turning a linter on.
    "S310",
]

[tool.ruff.lint.per-file-ignores]
# S608 flags SQL built by string interpolation. It is the most RELEVANT rule in the set for this
# repository and it is switched off per-file rather than globally, which is the important
# distinction: a NEW file that starts building SQL from strings is still caught.
#
# The 49 sites in these files interpolate an IDENTIFIER or a GUC value, neither of which PostgreSQL
# can bind as a parameter, and both are validated before they reach an f-string:
# `recall.control_plane.validate_table_name` is the allowlist chokepoint for table names, and the
# HNSW knobs are int-cast and range-checked in `PgVectorStore._hnsw_filtered_tuning`. Every other
# value in these queries travels as a psycopg bound parameter.
#
# ⚠️ Listed per-file rather than annotated per-line ON PURPOSE. 30 of the 49 are in `store.py`
# alone, and a file sprinkled with 30 `# noqa: S608` markers teaches a reviewer to skim past the
# one that is load-bearing. The exemption is stated once, here, with the chokepoint named.
"recall/store.py" = ["S608"]
"recall/generation_store.py" = ["S608"]
"recall/generations.py" = ["S608"]
"recall/schema.py" = ["S608"]
"recall/control_plane.py" = ["S608"]
"recall/calibration_v2.py" = ["S608"]
"recall/truth_extraction/_sqlite_cache.py" = ["S608"]
"recall/eval/longmemeval_perq.py" = ["S608"]
# Test and harness trees. These build throwaway tables against a disposable database and are not
# the security boundary; S105/S106 fire on the deliberate `recall:recall` development credentials.
# S104 fires on the `0.0.0.0` in `test_streamable_http_run_passes_transport_security`, which
# asserts the bind address is PASSED THROUGH to the transport. The literal is the fixture.
"tests/**" = ["S104", "S105", "S106", "S107", "S608"]
"benchmarks/**" = ["S105", "S106", "S107", "S608"]
"results/**" = ["S105", "S106", "S107", "S608"]
"scripts/**" = ["S105", "S106", "S107", "S608"]

# Static typing. 81% of this package's functions already carried a return annotation before this
# section existed, and nothing checked any of them — which is the state where the annotations are
# documentation rather than a constraint, and where documentation drifts. Turning the checker on
# found one real defect (`RECALL_TRANSPORT` was an unvalidated env string flowing into a
# `Literal`-typed SDK parameter) and one latent crash (`ensure_schema` indexed a `None` row when
# pointed at an existing non-recall table).
#
# `disallow_untyped_defs` rather than a permissive baseline: a partially-checked package silently
# stops checking wherever an annotation is missing, so the gate would pass while shrinking.
# No `python_version` pin. Setting it to the 3.11 floor makes mypy parse every installed stub at
# 3.11 too, and numpy's stubs use 3.12 `type` syntax — a hard parse error that no per-module
# override suppresses, so the gate would fail on a dependency's stub rather than on this code.
# The floor is checked where it is actually meaningful: the `floor` CI job RUNS the suite on
# 3.11 with the declared minimum of every direct dependency.
[tool.mypy]
# `recall_interop` is repo-only scaffolding (it is deliberately absent from the wheel's `packages`
# above), but it is type-checked anyway: it is the code path that produces PUBLISHED benchmark
# numbers, and a shape mismatch against the third-party harness it feeds does not raise — it
# degrades into a worse score that reads as a retrieval result.
files = ["recall", "recall_mcp", "recall_agent", "recall_interop", "recall_consistency", "benchmarks"]
# The agent-benchmark fixtures and oracles are INPUT, not source, and one of them is a decoy
# `recall/` package: `oracles/ts-worktree-import/installed/recall/` stands in for the editable
# install shared across every worktree on this machine, and the task is whether the agent's script
# imports the checkout's package or that one. mypy sees two modules named `recall` and stops with
# "Duplicate module named 'recall'" before checking anything at all, which is the same shadowing
# the task measures, arriving in the type checker. Excluded rather than renamed, because renaming
# it would destroy the measurement, and rather than noqa'd, because the fixtures are read by the
# agent under test and a comment addressed to our tooling would be visible to it.
#
# `benchmarks/artifacts/` is excluded for the same reason one level along: a run writes each
# session's sandbox there, so after any run the tree holds dozens of copies of `benchmarks/` and
# `recall/`. That directory is gitignored, so CI never sees it and only a local `mypy` breaks,
# which is worse rather than better: the gate would pass on the runner and fail for whoever tried
# to reproduce it.
#
# `benchmarks/atm_(full_run|bench).py` are the frozen ATM-Bench harness, excluded for the reason
# ruff's `extend-exclude` states above: they are byte-identical to the published run's code and a
# fix is a falsification of the reproduction pointer, not an improvement. They arrive with six
# errors, and it is worth writing down what they are rather than leaving "excluded" to imply
# "clean": two are a `str | None` reaching a parameter typed `str`, two an `int()` over a value
# typed `object`, one an `Embedder` assigned to a `VoyageEmbedder` name, and one an attribute the
# library had never had on `master` until this same change ported it over. The last one is a real
# incompatibility and is fixed in the LIBRARY, where the fix belongs; the other five are the type
# checker seeing dynamic JSON, and the run they produced is the evidence they did not fire.
exclude = "^benchmarks/(agent_ab/(workspaces|oracles)|artifacts)/|^benchmarks/atm_(full_run|bench)\\.py$"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Optional extras, absent from the type-check job by design: their absence is what proves the
# import guards work, and installing torch to type-check a 40-line reranker is not a trade worth
# making. `follow_imports = skip` rather than plain `ignore_missing_imports` so the result does
# NOT depend on whether the extra happens to be installed — a local run with `[fastembed]` and a
# CI run without it must agree, or the gate is advisory.
[[tool.mypy.overrides]]
module = [
    # `agent` extra, deliberately excluded from `dev` so CI proves the SDK-absent import path.
    # That is why it needs an entry here: `benchmarks/agent_ab/sdk_exec.py` and
    # `recall_agent/_sdk.py` import it, and the typecheck job installs `.[dev]` only, so without
    # this line mypy fails on a module the design intends to be missing.
    "claude_agent_sdk",
    "claude_agent_sdk.*",
    "fastembed.*",
    "transformers",
    "transformers.*",
    "onnxruntime",
    "onnxruntime.*",
    "membench",
    "membench.*",
    # Ships with fastembed; `recall.eval.vocab.bge_encoder` guards its import.
    "tokenizers.*",
    "voyageai.*",
    "sentence_transformers.*",
    # `finetune` extra. `benchmarks/rerank_finetune.py` imports torch inside main() only, so the
    # module imports and type-checks without it — the same guard as every entry above.
    "torch.*",
    "matplotlib.*",
    "datasets.*",
    # Transitive of the extras above and of pgvector; never imported by this package directly.
    "numpy.*",
    # bench extra (benchmarks/llm.py, benchmarks/systems.py) — lazily imported so the module
    # type-checks without it.
    "openai.*",
    "mem0.*",
    # BEAM ships as parquet, so `benchmarks/beam/dataset.py` reads it with pyarrow. `files` above
    # includes `benchmarks`, and the typecheck job installs `.[dev]` only, so without this the job
    # fails on a dependency it deliberately does not install.
    "pyarrow.*",
    # Lazily imported for benchmark env-file support. The typecheck job installs `.[dev]`, not
    # `.[bench]`, so this import must either be installed by dev or explicitly skipped here.
    "dotenv.*",
    "boto3.*",
    "onnxruntime.*",
    "transformers.*",
    "membench.*",
    # benchmarks/mtrag/multiquery.py is a benchmark module carrying no py.typed marker, and it is
    # imported by `deployable_fusion_weight` so the follow-on arm reuses its frozen fusion rather
    # than restating it. Same shape as every entry above: the importing module must type-check
    # whether or not the imported one is present, which also keeps the two mergeable in any order.
    "benchmarks.mtrag.multiquery",
    # Document and desktop adapters are optional at runtime and intentionally absent from the
    # lean typecheck job. Their imports are guarded in the extraction and desktop modules.
    "pdfplumber",
    "pdfplumber.*",
    "docx",
    "docx.*",
    "openpyxl",
    "openpyxl.*",
    "xlrd",
    "xlrd.*",
    "pptx",
    "pptx.*",
    "bs4",
    "bs4.*",
    "PySide6",
    "PySide6.*",
    "keyring",
    "keyring.*",
    # Optional application-level evaluator. The adapter must type-check when Ragas is absent.
    "ragas",
    "ragas.*",
    # ATM-Bench's official evaluator, which `benchmarks/atm_answer_diagnosis.py` imports for its
    # `is_abstention` and tokeniser rather than reimplementing them. It is NOT a dependency and is
    # never installed: the script takes `--atm-bench-root` and puts that checkout on `sys.path` at
    # run time, because a local reimplementation would measure this repository instead of the thing
    # the published score was computed with.
    #
    # This belongs here rather than on an inline `# type: ignore`, and `warn_unused_ignores = true`
    # above is the reason: an inline ignore is UNUSED for anyone who does have the checkout
    # importable, so it would fail exactly the developer best placed to run the script.
    "memqa",
    "memqa.*",
]
ignore_missing_imports = true
follow_imports = "skip"
