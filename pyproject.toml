[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# DISTRIBUTION name `recall-rag`; IMPORT name stays `recall`. They differ because `recall` on PyPI
# is taken — by an unrelated Python-2-era RPC framework whose only release is from 2014
# (https://pypi.org/project/recall/). It is not coming back, but the name is not reclaimable.
#
# `re-call` was the intended name and cannot be registered either: PyPI's typosquat-similarity
# guard collapses separators, so `re-call` normalises to `recall` and is rejected as "too similar
# to an existing project" — a stricter check than the exact-name availability that the `/simple/`
# index reports. `recall-rag` adds a distinguishing token (it collapses to `recallrag`, not
# `recall`), which clears the guard while keeping the `recall` identity in the name.
#
# ⚠️ The consequence of sharing the IMPORT name, stated because it bites at import time rather than
# at install time: the squatting `recall` distribution ALSO provides a top-level `recall` module,
# so installing both into one environment gives two distributions writing the same import path, and
# whichever installed last wins. Nothing detects it. Install `recall-rag`, never `recall`.
name = "recall-rag"
version = "0.9.0"
description = "Trustworthy retrieval for an AI agent's own memory — verdict, confidence and provenance per hit, or an explicit abstention"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Giulio D'Erme" }]
keywords = [
    "rag", "retrieval-augmented-generation", "agent-memory", "pgvector", "postgresql",
    "hybrid-search", "vector-search", "reranking", "mcp", "model-context-protocol",
    "abstention", "calibration", "llm-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

dependencies = [
    "psycopg[binary]>=3.3.4",
    # >=0.4, not >=0.3: `from pgvector import Vector` (recall/store.py) is a top-level export that
    # only exists from 0.4.0. On 0.3.x the package imports but that name does not resolve, so the
    # floor was declaring support for versions where `import recall.store` raises ImportError.
    "pgvector>=0.4",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.3"]
# Connection pooling — required only for PgVectorStore(pool_size=...), i.e. any server
# process. A CLI runs single-connection and should not pay for a pool maintenance thread.
pool = ["psycopg-pool>=3.2"]
# NB: the mcp floor is 1.27.2. Two separate requirements sit behind it, and the LATER one binds:
#   - 1.10.0 added the resource-server auth split (`AuthSettings.resource_server_url` + FastMCP's
#     `token_verifier=`), which `recall_mcp/auth.py` needs. Below it FastMCP raises on the
#     `auth=`/`auth_server_provider=` XOR, so the server fails loudly at import — not silently.
#   - 1.27.2 added `AccessToken.subject` / `.claims`, which is how `server.py` carries the tenant
#     (`AccessToken(..., claims={"tenant": ...})`, read back in `_current_tenant`). On 1.10-1.27.1
#     pydantic's `extra="ignore"` DROPS the claim at construction and every authenticated call
#     then dies on `token.claims` with AttributeError. That whole range installs cleanly and is
#     broken at request time, so 1.10 was not a sufficient floor.
# The CEILING is 2.0, and it is not cosmetic. mcp 2.0.0 (released 2026-07-28) removes
# `mcp.server.fastmcp`, moves `request_ctx` out of `mcp.server.lowlevel.server`, and renames every
# `ToolAnnotations` field to snake_case (`readOnlyHint` -> `read_only_hint`). `recall_mcp/server.py`
# uses all three. The floor above was researched and the ceiling was left unbounded, so a major
# release walked in on `>=` and broke `master` 22 minutes after its last green run, with nothing in
# this repo changed. Raising this cap is a PORT, not a bump.
# Keep this in step with the `dev` extra below.
# PyJWT[crypto] is declared DIRECTLY, not inherited from `mcp`. `recall_mcp.server` now imports
# `recall_mcp.oidc` unconditionally, which imports `jwt` and `jwt.algorithms.RSAAlgorithm` at module
# level, so a missing PyJWT is an ImportError on EVERY server start including stdio. `mcp` happens
# to pull `pyjwt[crypto]` transitively today, but nothing bounds it: a PyJWT 3.x satisfies that
# transitive `>=2.10.1` and would break `jwt.decode` with nothing in this repo changed. The
# `[crypto]` marker is load-bearing, not cosmetic — without it RSAAlgorithm does not import.
mcp = ["mcp>=1.27.2,<2", "psycopg-pool>=3.2", "PyJWT[crypto]>=2.10.1,<3"]
voyage = ["voyageai>=0.2"]
s3 = ["boto3>=1.35"]
# Learned sparse (SPLADE) retrieval. Deliberately NOT routed through sentence-transformers: its
# `SparseEncoder` API needs ST >= 5.0, while rerank/entail/finetune pin >=3.0 and the note below
# says to bump all three together. Going to `transformers` directly stops a retrieval experiment
# from raising the RERANKER's floor as a side effect, and the inference is ~20 lines either way
# (`recall/sparse.py`). Model weights are downloaded by the user at runtime, never vendored —
# see KNOWN_MODELS for the licence of each supported checkpoint.
# ⚠️ The CEILING is not cosmetic, for the same reason the `mcp` extra above carries one: this repo
# was broken once by a major release walking in on an unbounded `>=` with nothing here changed.
# EXERCISED against transformers 5.14.1 / torch 2.13. The 4.40 floor is the oldest release with the
# APIs used here and is NOT itself tested — treat it as a claim about API availability, not about a
# passing suite. Raising the cap to 6.x is a PORT, not a bump.
sparse = ["transformers>=4.40,<6", "torch>=2.0,<3"]
# NB: rerank / entail / finetune pin the same sentence-transformers floor — bump all three together.
rerank = ["sentence-transformers>=3.0"]
entail = ["sentence-transformers>=3.0"]
# numpy is named explicitly, not left to arrive transitively through matplotlib: it is a
# direct import of `recall/eval/vocab.py:crowding`, which SHIPS in the wheel.
eval = ["matplotlib>=3.7", "numpy"]
finetune = ["sentence-transformers>=3.0", "datasets>=2.0", "accelerate>=1.1", "numpy"]
# langchain_core only (not the langchain meta-package): the retriever adapter
# (recall/integrations/langchain.py) needs BaseRetriever + Document, nothing else. Floor 0.3 is the
# first pydantic-v2 line and the oldest the adapter is tested against. Keep this in step with `dev`.
langchain = ["langchain-core>=0.3"]
# llama-index-core only (not the `llama-index` meta-package): the retriever adapter
# (recall/integrations/llamaindex.py) needs BaseRetriever + TextNode/NodeWithScore, nothing else.
# It is a heavier tree than langchain-core (aiohttp, sqlalchemy, nltk, pillow, tiktoken); it is in
# `dev` anyway so the adapter is CI-tested and type-checked, not validated only on a laptop. Floor
# 0.11 is the oldest the adapter is tested against. Keep this in step with `dev`.
llamaindex = ["llama-index-core>=0.11"]
# Local competitive benchmark only (benchmarks/). NEVER added to `dev` or installed in CI — it is a
# heavy tree (mem0ai) and the benchmark is run deliberately, by hand, not on every push.
#
# `mem0ai` is pinned EXACTLY, not floored. It is the competitor being measured, and its extraction
# prompt, its retrieval defaults and its API all move between releases: 2.x renamed `search`'s
# arguments (`user_id=`/`limit=` -> `filters={"user_id": ...}`/`top_k=`) and now REJECTS the 1.x
# spelling outright, so a range would let a `pip install` months from now silently change what a
# published number means — or break the adapter outright. `==2.0.13` is the current stable release
# (2026-07-22) and the version `benchmarks/systems.py` is written against; it is recorded into
# every results artifact via `importlib.metadata.version("mem0ai")`. Bumping it is a deliberate
# re-run, not a resolver decision.
# pyarrow: BEAM ships as parquet and `benchmarks/beam/dataset.py` reads it directly. It was
# previously declared only as a MYPY override — i.e. the need was recorded for the type
# checker and not for the installer, so provisioning a box with `.[bench]` raised
# ModuleNotFoundError at the first parquet read rather than at install time.
# numpy is imported at MODULE level by benchmarks/beam/embed_parity.py, so a box
# provisioned with only this extra fails at first run rather than at install time.
bench = ["mem0ai==2.0.13", "openai>=1.0", "pyarrow>=15", "numpy>=1.26"]
# pytest-timeout: a chunker that fails to terminate would otherwise HANG the run instead of
# failing it — a hung CI job reads as "still running", not as a regression.
#
# ruff is UPPER-capped, and that is the point of the pin. A linter is the one dependency where
# resolving "newest" makes CI non-reproducible: ruff stabilises new rules in a minor release, so
# an unpinned `ruff check .` starts failing on unchanged code the day a release lands — which is
# exactly what 0.16.0 did to this repo (UP017 `datetime.UTC`, stricter import sorting; 131 hits
# across the existing suite, none from any code change). The floor stays open; only the ceiling
# is fixed, below the release that changed the ruleset. Adopting 0.16's rules is a deliberate
# repo-wide sweep — bump the cap and fix the findings in its own PR, not as a side effect of an
# unrelated one.
dev = [
    "pytest>=8", "pytest-timeout>=2.3", "pytest-cov>=5", "ruff>=0.5,<0.16",
    # Capped at <2 for the same reason as the `mcp` extra above — 2.0 is a port, not a bump.
    # `test` and `typecheck` install `.[dev]` only, so an uncapped floor here breaks both jobs
    # even with the extra capped.
    "mcp>=1.27.2,<2", "psycopg-pool>=3.2",
    "PyJWT[crypto]>=2.10.1,<3",
    # langchain-core: the `test` and `typecheck` jobs install `.[dev]` only, so the LangChain
    # adapter's test and its mypy pass need it here too. Mirrors the `langchain` extra above.
    "langchain-core>=0.3",
    # llama-index-core: same reason — the LlamaIndex adapter's test and mypy pass need it in the
    # `.[dev]` jobs. Mirrors the `llamaindex` extra above. Heavier tree; accepted for full CI cover.
    "llama-index-core>=0.11",
]

# Declared LAST among the `[project]` sub-tables: every bare key above (`dependencies`,
# `classifiers`, …) belongs to `[project]`, and opening a sub-table earlier would silently
# reparent whatever followed it.
[project.urls]
Homepage = "https://github.com/GiulioDER/RE-call"
Source = "https://github.com/GiulioDER/RE-call"
Issues = "https://github.com/GiulioDER/RE-call/issues"
Changelog = "https://github.com/GiulioDER/RE-call/blob/master/CHANGELOG.md"
"Evaluation findings" = "https://github.com/GiulioDER/RE-call/blob/master/results/FINDINGS.md"
"Security policy" = "https://github.com/GiulioDER/RE-call/blob/master/SECURITY.md"

[project.scripts]
recall = "recall.cli:main"
recall-enterprise = "recall.enterprise_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["recall", "recall_mcp"]

[tool.pytest.ini_options]
# `pytest-timeout` was a declared dependency with nothing configuring it, which made it inert:
# the comment beside it in `[project.optional-dependencies].dev` explains that a test which
# fails to terminate "reads as 'still running', not as a regression", and that was exactly the
# state the suite was in. CI runs bare `pytest -q`, so a hang burned the job's full timeout
# instead of failing. 120s is far above the slowest test here (the whole suite runs in ~3
# minutes) and far below anything anyone would wait for; a test with a legitimate reason to
# take longer can raise its own with `@pytest.mark.timeout(n)`.
#
# `thread` rather than `signal`: signal-based timeouts do not work on Windows, and this suite is
# developed there and run on Linux in CI.
timeout = 120
timeout_method = "thread"

# Collect ONLY `tests/`. Two analysis scripts under `results/` are named `paired_rerank_test.py`
# ("paired rerank test" as in the statistical test, not a unit test); neither defines a single
# test function. Bare `pytest -q` picked them up anyway, and because they share a basename with
# no package `__init__.py` between them, pytest could not give them distinct module names and
# aborted the ENTIRE run with a collection error — so two files that contain no tests could turn
# the whole suite red. Every real test in this repository lives in `tests/`; verified by
# searching for `test_*.py` / `*_test.py` outside it and finding only those two.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Static typing. 81% of this package's functions already carried a return annotation before this
# section existed, and nothing checked any of them — which is the state where the annotations are
# documentation rather than a constraint, and where documentation drifts. Turning the checker on
# found one real defect (`RECALL_TRANSPORT` was an unvalidated env string flowing into a
# `Literal`-typed SDK parameter) and one latent crash (`ensure_schema` indexed a `None` row when
# pointed at an existing non-recall table).
#
# `disallow_untyped_defs` rather than a permissive baseline: a partially-checked package silently
# stops checking wherever an annotation is missing, so the gate would pass while shrinking.
# No `python_version` pin. Setting it to the 3.11 floor makes mypy parse every installed stub at
# 3.11 too, and numpy's stubs use 3.12 `type` syntax — a hard parse error that no per-module
# override suppresses, so the gate would fail on a dependency's stub rather than on this code.
# The floor is checked where it is actually meaningful: the `floor` CI job RUNS the suite on
# 3.11 with the declared minimum of every direct dependency.
[tool.mypy]
# `recall_interop` is repo-only scaffolding (it is deliberately absent from the wheel's `packages`
# above), but it is type-checked anyway: it is the code path that produces PUBLISHED benchmark
# numbers, and a shape mismatch against the third-party harness it feeds does not raise — it
# degrades into a worse score that reads as a retrieval result.
files = ["recall", "recall_mcp", "recall_interop", "benchmarks"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Optional extras, absent from the type-check job by design: their absence is what proves the
# import guards work, and installing torch to type-check a 40-line reranker is not a trade worth
# making. `follow_imports = skip` rather than plain `ignore_missing_imports` so the result does
# NOT depend on whether the extra happens to be installed — a local run with `[fastembed]` and a
# CI run without it must agree, or the gate is advisory.
[[tool.mypy.overrides]]
module = [
    "fastembed.*",
    # Ships with fastembed; `recall.eval.vocab.bge_encoder` guards its import.
    "tokenizers.*",
    "voyageai.*",
    "sentence_transformers.*",
    # `finetune` extra. `benchmarks/rerank_finetune.py` imports torch inside main() only, so the
    # module imports and type-checks without it — the same guard as every entry above.
    "torch.*",
    "matplotlib.*",
    "datasets.*",
    # Transitive of the extras above and of pgvector; never imported by this package directly.
    "numpy.*",
    # bench extra (benchmarks/llm.py, benchmarks/systems.py) — lazily imported so the module
    # type-checks without it.
    "openai.*",
    "mem0.*",
    # BEAM ships as parquet, so `benchmarks/beam/dataset.py` reads it with pyarrow. `files` above
    # includes `benchmarks`, and the typecheck job installs `.[dev]` only, so without this the job
    # fails on a dependency it deliberately does not install.
    "pyarrow.*",
    "boto3.*",
    "onnxruntime.*",
    "transformers.*",
    "membench.*",
    # benchmarks/mtrag/multiquery.py is a benchmark module carrying no py.typed marker, and it is
    # imported by `deployable_fusion_weight` so the follow-on arm reuses its frozen fusion rather
    # than restating it. Same shape as every entry above: the importing module must type-check
    # whether or not the imported one is present, which also keeps the two mergeable in any order.
    "benchmarks.mtrag.multiquery",
]
ignore_missing_imports = true
follow_imports = "skip"
