# The source of docs/FEATURE_MAP.md. Edit this file, then run `python tools/feature_map.py`.
#
# One [[feature]] per thing a user or an agent can do with RE-call. CI (`--check`) refuses:
#   - a console script, `recall` command or MCP tool that no feature names;
#   - a module in a shipped package that no feature's `modules` matches;
#   - a name that does not exist, or a glob that matches no tracked file;
#   - a docs/FEATURE_MAP.md that differs from what this file generates.
# In a glob, `*` also matches `/`, so `recall/lite/*` covers the whole directory.
# A module may belong to more than one feature; list it where a reader would look for it.

[[feature]]
id = "install"
area = "Install and connect"
name = "Install, setup wizard and uninstall"
summary = "Take a machine from nothing to a calibrated corpus wired into Claude Code or Codex, and take it apart again."
scripts = ["recall-install", "recall-uninstall"]
cli = ["setup", "wizard", "uninstall", "quickstart"]
modules = [
    "recall/wizard/*", "recall/setup.py", "recall/quickstart.py", "recall/seed.py",
    "recall/claude_code.py", "recall/codex.py", "recall/cli_commands/setup_wizard.py",
]
tests = ["tests/test_wizard*.py", "tests/test_setup*.py", "tests/test_quickstart*.py", "tests/test_codex*.py", "tests/test_claude_code*.py"]
docs = ["docs/INSTALLATION.md", "docs/GETTING_STARTED.md", "docs/WIZARD.md", "docs/CODEX_RECALL_INTEGRATION.md"]

[[feature]]
id = "doctor"
area = "Install and connect"
name = "Doctor and capability diagnostics"
summary = "Say which part of an install is wrong, and which optional models and extras are present, writing nothing."
