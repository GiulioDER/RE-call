modules = ["recall/doctor.py", "recall/capabilities.py", "recall/cli_commands/doctor_cmd.py"]
tests = ["tests/test_doctor*.py", "tests/test_capabilities*.py"]
docs = ["docs/INSTALLATION.md"]

