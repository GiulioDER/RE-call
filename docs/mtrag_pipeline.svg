<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1660" width="980" height="1660" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">The RE-call pipeline, index and query to verdict</title>
  <desc id="dsc">Write path: a memo carrying supersedes, valid_from and valid_until frontmatter is chunked and embedded locally with no API call. Query path: the query is embedded by the query encoder. Both meet in one PostgreSQL and pgvector database holding vectors and full text. Dense pgvector cosine and sparse Postgres full-text retrieval both feed Reciprocal Rank Fusion. An optional cross-encoder rerank, drawn dashed and amber, sits between fusion and the gap check; the solid default path bypasses it. Then a gap check against a calibrated threshold, then the trust layer enforcing supersession, validity and confidence, fed by a calibration fitted per embedder and corpus. The output is a verdict with confidence and provenance, or ABSTAIN with a reason.</desc>

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%"   stop-color="#04060c"/>
      <stop offset="44%"  stop-color="#05080f"/>
      <stop offset="68%"  stop-color="#070c1a"/>
      <stop offset="100%" stop-color="#0a1226"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="68%"  stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="70%"  stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#2dd4bf" stop-opacity="0.13"/>
      <stop offset="72%"  stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="52%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.60"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="42%"  stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="dbFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#06161e"/>
      <stop offset="30%"  stop-color="#0e2f3c"/>
      <stop offset="62%"  stop-color="#0a2531"/>
      <stop offset="100%" stop-color="#050f16"/>
    </linearGradient>
    <linearGradient id="dbLip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#08202a"/>
      <stop offset="34%"  stop-color="#2e8ea1"/>
      <stop offset="66%"  stop-color="#175360"/>
      <stop offset="100%" stop-color="#061a23"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d93b2"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5a524"/>
    </marker>
    <marker id="arDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c5f7a"/>
    </marker>
    <style>
      .sans  { font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
      .mono  { font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace; }
      .nodeT { font-size:17px; font-weight:600; fill:#e9f6ff; }
      .subT  { font-size:13px; font-weight:400; fill:#8aa0bd; }
      .colT  { font-size:13.5px; font-weight:700; fill:#93aac8; letter-spacing:.155em; }
      .amT   { font-size:16.5px; font-weight:600; fill:#f5a524; }
      .amS   { font-size:12.5px; fill:#bd8737; }
      .legT  { font-size:13.5px; fill:#8aa0bd; }
      .outT  { font-size:18px; font-weight:700; fill:#f4f9ff; }
      .outS  { font-size:15px; font-weight:600; fill:#67e8f9; }
    </style>
  </defs>

  <rect width="980" height="1660" fill="url(#field)"/>
  <ellipse cx="720" cy="430" rx="520" ry="430" fill="url(#glowCyan)"/>
  <ellipse cx="900" cy="120" rx="400" ry="360" fill="url(#glowViolet)"/>
  <ellipse cx="330" cy="1330" rx="480" ry="360" fill="url(#glowTeal)"/>
  <rect width="980" height="1660" fill="url(#vig)"/>

  <!-- ============ column headers ============ -->
  <text x="250" y="52" class="sans colT" text-anchor="middle">INDEX &#183; NO LLM, EVER</text>
  <rect x="150" y="64" width="200" height="2" rx="1" fill="url(#rule)" opacity=".55"/>
  <text x="730" y="52" class="sans colT" text-anchor="middle">QUERY</text>
  <rect x="655" y="64" width="150" height="2" rx="1" fill="url(#rule)" opacity=".55"/>

  <!-- ============ write path ============ -->
  <rect x="88" y="98" width="324" height="82" rx="41" fill="#0a1220" fill-opacity=".82" stroke="#2c4257" stroke-width="1.4"/>
  <text x="250" y="130" class="sans nodeT" text-anchor="middle">memo &#183; markdown + frontmatter</text>
  <text x="250" y="155" class="mono subT" text-anchor="middle">supersedes &#183; valid_from &#183; valid_until</text>

  <path d="M250 180 L250 224" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <rect x="150" y="230" width="200" height="62" rx="10" fill="#0a1220" fill-opacity=".82" stroke="#2c4257" stroke-width="1.4"/>
  <text x="250" y="268" class="sans nodeT" text-anchor="middle">chunk</text>

  <path d="M250 292 L250 336" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <rect x="110" y="342" width="280" height="62" rx="10" fill="#0a1220" fill-opacity=".82" stroke="#2c4257" stroke-width="1.4"/>
  <text x="250" y="373" class="sans nodeT" text-anchor="middle">embed</text>
  <text x="250" y="393" class="mono subT" text-anchor="middle">local, no API call</text>

  <path d="M250 404 C250 452 300 448 340 478" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ============ query path ============ -->
  <rect x="600" y="98" width="260" height="62" rx="31" fill="#0a1220" fill-opacity=".82" stroke="#2c4257" stroke-width="1.4"/>
  <text x="730" y="136" class="sans nodeT" text-anchor="middle">query</text>

  <path d="M730 160 L730 254" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <rect x="580" y="260" width="300" height="62" rx="10" fill="#0a1220" fill-opacity=".82" stroke="#2c4257" stroke-width="1.4"/>
  <text x="730" y="291" class="sans nodeT" text-anchor="middle">embed</text>
  <text x="730" y="311" class="mono subT" text-anchor="middle">query encoder</text>

  <path d="M730 322 C730 420 690 440 640 478" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ============ store ============ -->
  <path d="M190 512 L190 588 A300 34 0 0 0 790 588 L790 512 Z" fill="url(#dbFace)" stroke="#2c4257" stroke-width="1.4"/>
  <ellipse cx="490" cy="512" rx="300" ry="34" fill="#08202a" stroke="url(#dbLip)" stroke-width="2"/>
  <text x="490" y="562" class="sans nodeT" text-anchor="middle" font-size="18">PostgreSQL + pgvector</text>
  <text x="490" y="584" class="mono subT" text-anchor="middle">vectors and full-text in one database</text>

  <path d="M400 610 C400 646 300 646 260 678" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M580 610 C580 646 680 646 720 678" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ============ two legs ============ -->
  <rect x="110" y="684" width="300" height="62" rx="10" fill="#0a1220" fill-opacity=".82" stroke="#2c4257" stroke-width="1.4"/>
  <text x="260" y="715" class="sans nodeT" text-anchor="middle">dense</text>
  <text x="260" y="735" class="mono subT" text-anchor="middle">pgvector cosine</text>

  <rect x="570" y="684" width="300" height="62" rx="10" fill="#0a1220" fill-opacity=".82" stroke="#2c4257" stroke-width="1.4"/>
  <text x="720" y="715" class="sans nodeT" text-anchor="middle">sparse</text>
  <text x="720" y="735" class="mono subT" text-anchor="middle">Postgres full-text</text>

  <path d="M260 746 C260 792 340 796 400 822" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M720 746 C720 792 640 796 580 822" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ============ fusion ============ -->
  <rect x="320" y="828" width="340" height="62" rx="10" fill="#0a1220" fill-opacity=".9" stroke="#3d6f86" stroke-width="1.6"/>
  <text x="490" y="866" class="sans nodeT" text-anchor="middle">Reciprocal Rank Fusion</text>

  <!-- amber opt-in branch -->
  <path d="M440 890 L440 964" stroke="#f5a524" stroke-width="1.8" stroke-dasharray="7 6" fill="none" marker-end="url(#arAmber)"/>
  <rect x="330" y="970" width="300" height="66" rx="10" fill="#140f04" fill-opacity=".55" stroke="#f5a524" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="480" y="1010" class="sans amT" text-anchor="middle">cross-encoder rerank</text>
  <path d="M440 1036 L440 1112" stroke="#f5a524" stroke-width="1.8" stroke-dasharray="7 6" fill="none" marker-end="url(#arAmber)"/>
  <text x="668" y="998" class="sans amT" font-size="14.5">opt-in,</text>
  <text x="668" y="1017" class="sans amS">off by default</text>

  <!-- solid bypass -->
  <path d="M660 858 L716 858 L716 1092 L586 1092 L560 1112" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ============ gap check ============ -->
  <path d="M330 1118 L650 1118 L700 1152 L650 1186 L330 1186 L280 1152 Z" fill="#0a1220" fill-opacity=".9" stroke="#2c4257" stroke-width="1.4"/>
  <text x="490" y="1148" class="sans nodeT" text-anchor="middle">gap check</text>
  <text x="490" y="1170" class="mono subT" text-anchor="middle">calibrated threshold</text>

  <path d="M490 1186 L490 1236" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ============ trust layer ============ -->
  <path d="M490 1242 L716 1330 L490 1418 L264 1330 Z" fill="#0a1220" fill-opacity=".9" stroke="#3d6f86" stroke-width="1.6"/>
  <text x="490" y="1322" class="sans nodeT" text-anchor="middle">trust layer</text>
  <text x="490" y="1344" class="mono subT" text-anchor="middle">supersession &#183; validity &#183; confidence</text>

  <!-- calibration input -->
  <path d="M56 1300 L268 1300 L246 1362 L34 1362 Z" fill="#0a1220" fill-opacity=".7" stroke="#3a4d63" stroke-width="1.2"/>
  <text x="151" y="1326" class="sans subT" text-anchor="middle" font-size="13.5" fill="#93aac8">calibration</text>
  <text x="151" y="1347" class="mono subT" text-anchor="middle" font-size="11.5">fitted per embedder and corpus</text>
  <path d="M252 1330 L258 1330" stroke="#4c5f7a" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arDim)"/>

  <path d="M490 1418 L490 1462" stroke="#7d93b2" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ============ output ============ -->
  <rect x="196" y="1468" width="588" height="86" rx="43" fill="#08131f" fill-opacity=".92" stroke="url(#rule)" stroke-width="2.4"/>
  <text x="490" y="1503" class="sans outT" text-anchor="middle">verdict + confidence + provenance</text>
  <text x="490" y="1531" class="sans outS" text-anchor="middle">or ABSTAIN, with a reason</text>

  <!-- ============ legend ============ -->
  <line x1="196" y1="1602" x2="242" y2="1602" stroke="#7d93b2" stroke-width="2"/>
  <text x="254" y="1607" class="sans legT">runs if you change nothing</text>
  <line x1="480" y1="1602" x2="526" y2="1602" stroke="#f5a524" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="538" y="1607" class="sans legT" fill="#bd8737">opt-in, enabled by name</text>
</svg>
