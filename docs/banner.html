  Source of docs/banner.png (README header).

  Build:
    1. python docs/make_banner_graph.py > docs/_chaos.svg
       then paste it between the CHAOS-BEGIN / CHAOS-END markers below.
       (Only needed when the swarm parameters change; the fragment is already inlined.)
    2. chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2          --window-size=1280,640 --screenshot=docs/_2x.png docs/banner.html
    3. python -c "from PIL import Image; Image.open('docs/_2x.png').convert('RGB')          .resize((1280,640), Image.LANCZOS).save('docs/banner.png', optimize=True)"

  Step 3 is not optional. Rendering straight to 1280x640 loses the supersampled edges;
  rendering to 2560x1280 and shipping that is a 3.9 MB README header. Downsampling from
  2x gives crisp type at ~800 KB, because averaging also makes the grain compressible.
-->

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:640px; overflow:hidden; }
  body { background:#04060c; position:relative; font-family:"Segoe UI", system-ui, sans-serif; }
  .stage { position:absolute; inset:0; }

  /* ---------- light field: dark left, luminous right ---------- */
  .field {
    position:absolute; inset:0;
    background:
      radial-gradient(560px 460px at 74% 46%, rgba(34,211,238,.30) 0%, rgba(34,211,238,0) 68%),
      radial-gradient(420px 380px at 92% 12%, rgba(139,92,246,.34) 0%, rgba(139,92,246,0) 70%),

  }
  .vig {
    position:absolute; inset:0;
    background:radial-gradient(120% 96% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,.62) 100%);
  }
  .grain { position:absolute; inset:0; opacity:.05; mix-blend-mode:screen; }

  /* ---------- wordmark ---------- */
  .head { position:absolute; left:92px; top:222px; }
  .wm {
    font-size:114px; font-weight:800; letter-spacing:-.035em; line-height:1;
    color:#f4f9ff;
    text-shadow:0 0 22px rgba(34,211,238,.30), 0 2px 0 rgba(0,0,0,.5);
  }
  /* .mark shrink-wraps the wordmark so the rule spans exactly RE-call, and keeps doing so
     if the text or the font size changes. Do not hardcode a px width here. */
  .mark { width:fit-content; }
  .rule {
    margin-top:24px; width:100%; height:4px; border-radius:2px;
    background:linear-gradient(90deg,#22d3ee 0%,#5eead4 42%,#8b5cf6 100%);
    box-shadow:0 0 16px rgba(34,211,238,.55);
  }
  .kicker {
    margin-top:24px; font-size:16.5px; font-weight:600;
    letter-spacing:.155em; text-transform:uppercase; color:#93aac8;
  }
  .kicker span { color:#4c5f7a; }

  /* ---------- the scene ---------- */
  .obj { position:absolute; left:660px; top:30px; width:600px; height:610px; }

  /* labels, not UI chrome: a border and a filled box compete with the artwork */
  .chip {
    position:absolute; font-family:Consolas,"Cascadia Mono",monospace; font-size:14px;
    padding:4px 9px; border-radius:4px; white-space:nowrap;
    background:rgba(4,9,18,.52);
    text-shadow:0 0 8px rgba(2,6,14,.95), 0 1px 2px rgba(2,6,14,.9);
  }
  .chip.amber { color:#f5a524; }
  .chip.amber s { color:#bd8737; text-decoration-color:#f5a524; }
  .chip.cyan  { color:#67e8f9; }
  .chip b { font-weight:400; color:#e9f6ff; }

  .claim {
    position:absolute; left:372px; top:558px; width:220px; text-align:right;
    font-size:13.5px; font-style:italic; color:#8aa0bd;
  }
  .claim b { color:#f5a524; font-style:normal; font-weight:700; }
</style></head>
