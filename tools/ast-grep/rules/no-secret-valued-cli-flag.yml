id: no-secret-valued-cli-flag
language: python
severity: error
message: This flag takes a secret's value on the command line; take the name of an environment variable instead.
note: |
  A process's argv is readable by every user on the host through /proc/<pid>/cmdline for as long
  as it runs, and `pgrep -af` prints it. On 2026-09-30 a runner on a shared host held two provider keys in
  its argv for 19 minutes, and one `pgrep -af` copied both into a session transcript. The
  convention here is a flag that names the variable, as `--api-key-env` does in
  scripts/run_openrouter_answer_batch.py.
rule:
  kind: string
  regex: ^["']--([a-z0-9]+[-_])*(api[-_]?key|token|secret|password|passwd)["']$
  inside:
    kind: argument_list
    inside:
      any:
        - pattern: $PARSER.add_argument($$$)
        - pattern: click.option($$$)
        - pattern: typer.Option($$$)
