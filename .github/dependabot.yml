version: 2
updates:
  # `uv`, not `pip`. This project is uv-managed and CI runs `uv lock --check`, so a bump that
  # edits pyproject.toml without regenerating uv.lock fails the audit job and can never merge —
  # which is exactly what the first `pip` batch did (#44-#48: all red on lockfile drift, while
  # their test jobs passed). The `uv` ecosystem updates the lockfile alongside the manifest.
  #
  # If a Dependabot run ever reports this ecosystem as unsupported, delete this block rather than
  # reverting to `pip`: no dependency PRs is better than a permanent queue of unmergeable ones,
  # and the `audit` job already runs pip-audit over the resolved dependency set, so vulnerability
  # scanning does not depend on this file.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Three dependencies in `pyproject.toml` are capped ON PURPOSE, each with its reasoning
    # written next to the pin. Dependabot cannot read that reasoning, so left alone it reopens
    # the same three PRs every week — and the resolver's opinion slowly becomes the repo's.
    #
    # These are NOT "we haven't got round to it" caps. Lifting any of them is a deliberate piece
    # of work with its own PR, and that is exactly what an ignore rule preserves: it removes the
    # weekly nag, not the option.
    #
    # ⚠️ There are now TWO CLASSES of rule below, and the invariant differs. Added 2026-09-01,
    # because until then every rule was a cap claim and a reader was entitled to assume it.
    #
    # CLASS 1, a CAP CLAIM (mem0ai, ruff). Mirrors a deliberate cap in pyproject.toml. A rule
    # here is a claim about a cap that exists. If a cap is ever lifted in pyproject.toml, delete
    # its rule in the SAME change — a stale ignore silently withholds real updates, which is the
    # worse failure of the two.
    #
    # CLASS 2, a NOISE RULE (mcp, transformers, boto3, pypdf). Says only "not every week", and
    # is NOT backed by a cap: do not go looking for one. Every class 2 rule therefore keeps
    # `semver-major`, so a genuinely significant move still opens a PR and the repository can
    # never go silently dark on a runtime dependency. That is the whole difference from class 1,
    # where the cap itself is the point.
    #
    # ⚠️ A class 2 rule most likely suppresses SECURITY PRs for that dependency too, and this is
    # stated as UNCONFIRMED rather than asserted: GitHub's options reference says Dependabot
    # filters ignored dependencies out after the allow step, but does not spell out the security
    # path, and no one has watched it happen here. Assume suppressed, since that is the failing
    # direction.
    #
    # The compensating control is the one this file already relies on, and it does NOT depend on
    # this behaviour either way: the `audit` job runs pip-audit over the resolved dependency set,
    # so a vulnerability is still DETECTED in CI. It just may not arrive as a pull request. If
    # that trade stops being acceptable for one of these, delete its rule rather than narrowing
    # it.
    ignore:
      # mem0ai: pinned EXACTLY, and the only one of the three whose bump PR goes GREEN — the
      # competitive benchmark is never installed in CI, so no test can fail on it. That is what
      # makes it dangerous: mem0ai is the competitor being measured, its version is recorded into
      # every results artifact via importlib.metadata, and its extraction prompt and retrieval
      # defaults move between releases. A merged bump would silently change what "Mem0" means in
      # already-published comparisons. Bumping it is a re-run, not a resolver decision.
      # No update-types: every version is ignored, because the pin is `==`.
      - dependency-name: "mem0ai"

      # ruff: capped `<0.17` because 0.16.0 changed the default enabled rule set from 59 rules to
      # 413. The project pins the pre-0.16 baseline explicitly in pyproject.toml; adopting any new
      # 0.16 rules is a targeted cleanup, not a side effect of resolving the newest linter.
      # Patches within 0.16.x still arrive; minor and major do not.
      #
      # 🔁 `semver-patch` added 2026-09-01, on evidence rather than principle. The paragraph
      # above says "Patches within 0.16.x still arrive", and #569 (0.16.3 -> 0.16.5) arrived and
      # went RED on `ruff check`. So the assumption that a patch cannot move the enabled rule set
      # is false for this linter, and the cap is only honoured if patches are held too. All three
      # types are now listed, which is exhaustive; it stays spelled out rather than collapsing to
      # a bare `dependency-name` because the pin is `<0.17`, not `==`, and a bare name would
      # claim a stricter cap than pyproject.toml actually carries.
      - dependency-name: "ruff"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"

      # ---- class 2 below: noise rules, no cap behind them, major deliberately still allowed ----

      # mcp: pinned EXACTLY (`mcp==2.1.0`, in three extras), so every bump is a pin edit and the
      # protocol library is one where a wire-format change is not a routine upgrade. A major
      # still opens, which is when we want to look.
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

      # transformers: `>=4.40,<6`. Model and tokenizer behaviour moves between minors and this is
      # the sparse/reranker path, so a bump is a re-measure rather than a resolver decision.
      # NOTE the interaction: `<6` already blocks the major, so while that cap stands this rule
      # is effectively total. Delete the rule if the cap is ever lifted, or the silence changes
      # meaning without anything being edited.
      - dependency-name: "transformers"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

      # boto3: `>=1.35`, uncapped. It ships near-daily patch releases against the S3 path; that
      # cadence is the entire reason this rule exists. Majors are rare and still open.
      - dependency-name: "boto3"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

      # pypdf: `>=5.0`, uncapped. Document-extraction behaviour, exercised by the ingest tests;
      # worth a deliberate look on a major rather than a weekly patch PR.
      - dependency-name: "pypdf"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

  # This half is proven: the first batch (#41-#43) bumped checkout, setup-python and setup-uv,
  # and merged green.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
