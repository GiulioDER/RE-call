name: Release

# Publishes to PyPI when a tag is pushed, and to TestPyPI on demand.
#
# Authentication is **Trusted Publishing** (OIDC), so there is no API token in this repository's
# secrets — nothing to leak, nothing to rotate, and a stolen `contents: write` cannot publish. It
# does require one-time setup on PyPI before the first run:
#
#   PyPI -> the `recall-rag` project (or "pending publisher" if it does not exist yet)
#     -> Publishing -> Add a new publisher -> GitHub
#        owner: GiulioDER   repository: RE-call   workflow: release.yml   environment: pypi
#
# Without that, the `publish` job fails on authentication — it never publishes to the wrong place.
# The `environment:` is what lets a required reviewer sit between a pushed tag and a release that
# can never be un-published: a version number on PyPI is permanent, even after a yank.
#
# ⚠️ That sentence was ASPIRATIONAL until 2026-07-29. The `pypi` environment existed with **no
# protection rules at all**, so every tag published straight through — including v0.7.0 — and the
# comment above read as a description of a gate that was not there. An environment lives in repo
# settings, not in this file, so nothing here could report the gap and nothing did.
#
# It is armed now:
#
#     required reviewer      GiulioDER
#     prevent_self_review    false  ← deliberate: the sole collaborator must be able to approve,
#                                     or the gate blocks every release instead of pausing it
#     deployment refs        custom policy: tag `v*` and branch `master`
#
# Two refs, for the two ways this workflow runs. A tag push (`v*`) is the normal release. The
# `master` branch policy is what keeps `workflow_dispatch --target pypi` usable — a dispatch runs
# from a branch, so without it a manual publish would be refused. A feature branch still cannot
# publish, and either route still stops at the reviewer. TestPyPI is unaffected by all of this.
#
# Verify it, because settings drift silently and this file cannot fail when they do:
#
#     gh api repos/GiulioDER/RE-call/environments/pypi
#     gh api repos/GiulioDER/RE-call/environments/pypi/deployment-branch-policies
#
# If `protection_rules` comes back empty, the gate is gone and a tag push publishes unreviewed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  # Build ONCE and hand the same artifacts to every downstream job. Rebuilding per job would mean
  # the thing that was verified is not bit-for-bit the thing that was published.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Build sdist and wheel
        run: uv build

      # Metadata errors (an unreadable README, a bad classifier) are rejected by PyPI at UPLOAD
      # time, which is the worst moment to discover them: on a tag push, the tag already exists.
      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  # Install the built wheel into a clean environment and exercise it. `uv build` succeeding only
  # proves the metadata parses — it says nothing about whether the wheel's contents import, or
  # whether a module was left out of `[tool.hatch.build.targets.wheel].packages`.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]  # the declared floor and the newest supported
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}

      # From the wheel, NOT from the checkout — `pip install -e .` would import the source tree
      # and pass even if the wheel shipped an empty package.
      - name: Install the built wheel
        run: pip install dist/*.whl

      - name: Import and run the console script
        run: |
          cd "$(mktemp -d)"   # away from the source tree, so nothing resolves by accident
          python -c "import recall, recall_mcp; from recall.trust import trusted_search; print(recall.__name__, 'ok')"
          recall --help > /dev/null
          echo "console script ok"

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || inputs.target }}
    permissions:
      id-token: write  # the OIDC token Trusted Publishing exchanges for an upload credential
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          # A tag push always goes to PyPI. A manual run goes wherever it was asked to.
          repository-url: ${{ (github.event_name == 'push' || inputs.target == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  # A tag is not a release. Five tags were pushed and published to PyPI before anyone noticed the
  # repository sidebar still read v0.5.0 — the only GitHub Release that existed, hand-made months
  # of versions earlier. Nothing was broken and nothing reported it, because creating the Release
  # had always been a manual habit and habits do not fail loudly when they lapse.
  #
  # `needs: publish` is the ordering that matters: a Release announces something that shipped, so
  # it must not exist for a version PyPI rejected. The `if` keeps it to tag pushes — a
  # workflow_dispatch has no tag to attach one to.
  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the only thing in this workflow that needs it: creating the Release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # the tag object, so `git tag -l --format` can read its subject

      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next `## [` heading. Falls back to
          # generated notes rather than shipping an empty release body.
          # `index(...) == 1` rather than a built regex: a dynamic awk regex would need the
          # brackets escaped, and getting that wrong turns "[0.7.0]" into a character class that
          # matches nothing — silently, falling back to generated notes on every release.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 {inside=1; next}
            inside && index($0, "## [") == 1 {exit}
            inside {print}
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no CHANGELOG section for $version — falling back to generated notes"
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          if [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME — $subject" \
              --notes-file notes.md --latest --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME — $subject" \
              --generate-notes --latest --verify-tag
          fi
