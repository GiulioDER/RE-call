name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual trigger. Added 2026-08-06 during a GitHub Actions outage in which webhook delivery was
  # throttled to ~15%: three merges landed on master with no run created for any of them, and
  # there was no way to ASK for one. A dropped push event is gone -- it is never replayed -- so
  # without this the only route to a verdict on master is another push, which is a poor reason to
  # commit something. `gh workflow run CI --ref master` now works.
  workflow_dispatch:

jobs:
  schema-migrations:
    name: Schema migrations (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]
    services:
      db:
        image: pgvector/pgvector:pg${{ matrix.postgres }}
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall
          POSTGRES_DB: recall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recall"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      RECALL_TEST_DSN: postgresql://recall:recall@localhost:5432/recall
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,documents]"
      - name: Exercise migrations, lineage, generations and calibration binding
        run: >-
          pytest -q tests/test_schema_migrations.py tests/test_generations.py
          tests/test_calibration_v2.py

  test:
    runs-on: ubuntu-latest

    # Integration tests hit a real pgvector database — no mock DB. Spin one up as a service.
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall
          POSTGRES_DB: recall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recall"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # The suite DROPs tables, so it reads RECALL_TEST_DSN and never RECALL_DSN — see
      # tests/conftest.py. RECALL_DSN is deliberately left unset here.
      RECALL_TEST_DSN: postgresql://recall:recall@localhost:5432/recall

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip

      # Engine + dev tooling only. The optional heavy extras are exercised locally:
      #   rerank/entail -> sentence-transformers (their real-model tests self-skip here)
      #   voyage -> cloud embedder (its one test skips without VOYAGE_API_KEY)
      - name: Install
        run: pip install -e ".[dev,documents]"

      - name: Lint (ruff)
        run: ruff check .

      # Coverage over the SHIPPED packages only (`recall`, `recall_mcp`) — putting the tests in
      # the denominator inflates the number with code that is 100% covered by definition.
      #
      # The floor is 70, measured against ~75% in exactly this environment (the `[dev]` extra,
      # no fastembed/voyage/rerank — the model-backed tests self-skip here, so their modules read
      # lower than a local run with the extras installed). It is a RATCHET, not a target: set
      # below the observed number so a normal PR never trips it on noise, and raised deliberately
      # when a real jump lands. A gate nobody fails on drifts down one PR at a time; a gate pinned
      # to the exact current number fails on the first unlucky rounding.
      - name: Test (pytest on real pgvector, with coverage)
        run: pytest -q --cov=recall --cov=recall_mcp --cov-report=term-missing --cov-report=xml --cov-fail-under=70

  # Static typing, in its own job: it needs no database, so a type error surfaces in ~30s instead
  # of behind the full integration suite, and a red DB service never hides a red type check.
  #
  # Optional extras are deliberately NOT installed here. `recall.rerank` / `recall.entailment` /
  # `recall.embeddings` import theirs lazily behind a guard, and pyproject's mypy overrides pin
  # those modules to `follow_imports = skip` so this job's result does not depend on whether a
  # 2 GB torch wheel happens to be present.
  # The session hooks, on the platform they actually run on.
  #
  # These guard the workspace: they decide whether a session may claim a checkout,
  # and they run `docker rm -f`. Three consecutive audits found P0 defects in them
  # while every CI run was green, because `testpaths = ["tests"]` in pyproject.toml
  # and these suites live in `scripts/` as `*_tests.py`, so pytest collected NONE of
  # them and no job invoked them. ~66 tests, zero of them executed by CI.
  #
  # **windows-latest, and not a skip on ubuntu.** The hooks are Windows-targeted by
  # construction: liveness via `tasklist` because Git Bash's `kill -0` cannot see a
  # Windows pid, process-tree kills via `taskkill /T /F`, and a `find_bash` that
  # exists because System32's WSL launcher shadows Git Bash on PATH. Running these
  # on ubuntu would take the POSIX branch of every one of those and report green
  # for code paths that never execute in practice, which is the failure mode the
  # suites themselves are written against. The repository is public, so Windows
  # runner minutes are free.
  # The installer, on a machine that has never run recall.
  #
  # Every wizard defect found so far was found by RUNNING the install, never by reading it or by a
  # unit test: a database that died on a bind mount, a first `up` that always failed, an image that
  # was silently the wrong one, an upload written to a table nothing reads. A runner is the only
  # clean machine available on demand — no image cache, no volumes, no `wizard.state.json` — so this
  # is the one place that condition can be reproduced on every change instead of once.
  #
  # **It deliberately does NOT build the recall image.** `run_headless` starts `db` only (see the
  # `services=("db",)` call it makes), and the generated Dockerfile pins the RUNNING version from
  # PyPI. Building here would make every PR between a version bump and its release fail on a
  # missing wheel — a red build caused by the release calendar rather than the change. Whether the
  # image builds and the MCP services start is a separate question, and belongs in a job that can
  # be pinned to a published version.
  #
  # ⚠️ Blind to Windows filesystem semantics, which is where the sharpest defect so far came from
  # (PostgreSQL taking EINTR on a bind-mounted WAL and dying). The database now lives on a named
  # volume, so that surface is much smaller, but this job cannot speak for it.
  clean-install:
    name: Clean install (wizard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,fastembed,documents]"

      # A real config, with the shape a first-run user writes: a data root and no DSN, so the
      # wizard provisions its own database rather than being handed one.
      - name: Write the wizard config
        run: |
          mkdir -p "$RUNNER_TEMP/install/memory"
          cat > "$RUNNER_TEMP/install/wizard.json" <<JSON
          {
            "embedder": "fastembed",
            "corpus_version": "ci-clean-install",
            "data_root": "$RUNNER_TEMP/install",
            "project": "default",
            "docs_root": "$GITHUB_WORKSPACE/docs",
            "code_root": "$GITHUB_WORKSPACE/recall",
            "memory_root": "$RUNNER_TEMP/install/memory",
            "project_root": "$RUNNER_TEMP/install/project"
          }
          JSON
          echo "a durable fact about widget alignment tolerances" \
            > "$RUNNER_TEMP/install/memory/notes.md"

      - name: Install recall
        run: python -m recall.cli wizard --headless --config "$RUNNER_TEMP/install/wizard.json"

      # ⚠️ Asserting the ARTIFACTS, not the report's wording. An install that refused or degraded
      # can still exit 0 and print a report, and this repository has shipped a report claiming
      # "install complete" for a tenant that could answer nothing.
      #
      # `.mcp.json` is the sharp check: `wiring.server_blocks` omits a tenant it cannot serve, so a
      # block for `default-docs` existing IS the assertion that the corpus built, validated,
      # calibrated and promoted. A corpus that failed any of those silently loses its block.
      - name: The install produced a servable stack
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/install"
          for f in docker-compose.recall.yml Dockerfile wizard.state.json; do
            test -f "$root/$f" || { echo "missing $f"; exit 1; }
          done
          mcp="$root/project/.mcp.json"
          test -f "$mcp" || { echo "no .mcp.json: nothing was wired"; exit 1; }
          python - "$mcp" <<'PY'
          import json, sys
          servers = json.loads(open(sys.argv[1], encoding="utf-8").read())["mcpServers"]
          print("wired servers:", sorted(servers))
          missing = [t for t in ("default-docs", "default-code") if t not in servers]
          if missing:
              raise SystemExit(
                  f"no server block for {missing}. server_blocks omits a tenant it cannot serve, "
                  "so this means the corpus did not certify - the install reported success and "
                  "left nothing able to answer."
              )
          PY

      - name: Remove the stack this job started
        if: always()
        run: |
          compose="$RUNNER_TEMP/install/docker-compose.recall.yml"
          test -f "$compose" && docker compose -f "$compose" down -v || true

  # The desktop UI, which until now was tested only on a maintainer's machine.
  #
  # ⚠️ **No job installed the `desktop` extra, so every test guarding the UI silently SKIPPED on
  # every CI run.** `tests/test_desktop.py` opens with `pytest.importorskip("PySide6")`, and the
  # installing jobs use `.[dev,documents]`, `.[dev]` and `.[dev,mcp,documents]`. Nothing was red;
  # the tests simply never ran. That covered, among others, the regression test for a Save button
  # that reported "Configuration saved" and saved nothing — the defect existed precisely because
  # nothing in CI could see it.
  #
  # A separate job rather than widening `test`, because PySide6 is a large wheel and the main suite
  # already runs a database; there is no reason for every contributor's test run to pay for Qt.
  #
  # `desktop` was also absent from every PUBLISHED release until 0.9.6, so before then this job
  # could not have installed it even if it had asked.
  desktop:
    name: Desktop UI
    runs-on: ubuntu-latest
    env:
      # Qt has no display on a runner. The tests set this themselves, but a missing platform plugin
      # aborts at import rather than failing a test, so it is set here too: the failure mode this
      # job exists to prevent is "the suite did not run", and a crash before collection looks
      # exactly like that.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip

      # Qt needs these shared libraries on a headless runner even with the offscreen platform;
      # without them PySide6 imports and then aborts, which importorskip would swallow as a skip.
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install
        run: pip install -e ".[dev,desktop]"

      # Fails the job if PySide6 is not importable, INSTEAD of letting the suite skip. A skip and a
      # pass render identically in a green check, which is the whole reason this gap survived.
      - name: Refuse to pass by skipping
        run: python -c "import PySide6; print('PySide6', PySide6.__version__)"

      - name: Desktop suite
        run: pytest -q tests/test_desktop.py

  session-hooks:
    name: Session hooks (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      # No `pip install -e .` on purpose: these hooks import nothing from `recall`,
      # and they must keep working in a checkout where the package is not installed,
      # because that is how ~/.claude/hooks/ runs them.
      - name: SessionStart hook
        run: python scripts/session_start_hook_tests.py

      - name: SessionEnd hook
        run: python scripts/session_end_hook_tests.py

      # Git Bash, which windows-latest ships. This suite covers session-space.sh,
      # the shell half of the same guard, including the claim-lock atomicity that
      # `set -C` silently failed to provide.
      - name: session-space.sh
        shell: bash
        run: bash scripts/session_space_tests.sh

  # Documentation citations, which rot faster than anything else in this repository: one commit
  # (79a0d6ed) shifted recall/index.py by 26 lines and broke 23 `path:line` references across five
  # documents at once. `fetch-depth: 0` is load-bearing and not a habit — the check asks git how
  # each cited file moved since the citing document was last committed, and a shallow clone cannot
  # answer that. The script refuses a shallow checkout rather than reporting a pass it never made.
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      # Standard library only, so this needs no install step and cannot be broken by a dependency.
      - name: Check documentation citations
        run: python scripts/check_doc_citations.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]" mypy

      - name: Type check (mypy)
        run: mypy

  # The declared floors, actually installed and actually run.
  #
  # Every other job resolves the NEWEST of everything, so the `>=` bounds in pyproject.toml were
  # never exercised: an old MCP floor and the current `mcp>=2` floor are indistinguishable to a
  # green build once the newest resolver has moved on. MCP 2 is the supported server API now
  # because it provides the `MCPServer` import path and typed request context injection used by
  # `recall_mcp.server`.
  # `pgvector>=0.3` was wrong the same way: `from pgvector import Vector` is a 0.4.0 export, so the
  # declared floor named versions where `import recall.store` raises ImportError. A floor nothing
  # resolves at is documentation, not a constraint, and it is documentation that was false.
  #
  # Lowest supported Python as well as lowest dependencies: this is the whole floor, not half of
  # it. Verified green at py3.11.15 + mcp 2.0.0 + pgvector 0.4.0 + psycopg 3.3.4 + pytest 8.0.0,
  # and verified RED against MCP 1 after the MCP 2 port.
  floor:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall
          POSTGRES_DB: recall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recall"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      RECALL_TEST_DSN: postgresql://recall:recall@localhost:5432/recall

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # The `requires-python` floor, not the version the other job happens to use.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      # `--resolution lowest-direct`: oldest version of each DIRECT dependency, transitives
      # resolved normally. `lowest` would also pin every transitive to its floor, which tests
      # other projects' constraint hygiene rather than ours.
      - name: Install the declared minimums
        run: uv pip install --system --resolution lowest-direct -e ".[dev,mcp,documents]"

      - name: Show what actually resolved
        run: uv pip list --system

      - name: Test (pytest on real pgvector)
        run: pytest -q

  # Every `path:line` citation in docs/**/*.md still points at the code it claims.
  #
  # Its own job, and a fast one: pure file reading, no database, no models, no install beyond a
  # Python interpreter, so a stale citation surfaces in seconds rather than behind the 12-minute
  # integration suite. The same check also runs inside `test` as tests/test_citation_anchors.py,
  # which is where the mutation tests live; this job exists so the answer arrives early and so a
  # red database service cannot hide it.
  #
  # WHY IT IS A GATE AT ALL. Measured 2026-08-18: while docs/UNCALIBRATED_FIRST_RUN_DESIGN.md was
  # being written, three concurrent merges to master moved cited lines, one of them moving 13 of
  # 13 checked citations in a single commit. Every one was caught by hand. A merged document
  # asserting `file.py:123 does X` when line 123 is a closing paren is a silent correctness
  # defect, and it is silent precisely because the line still exists -- which is why an
  # existence check reported "41 citations, 0 broken" over three citations pointing at a `try:`,
  # a docstring's closing quotes and the wrong error branch.
  #
  # No `pip install`: the checker imports nothing outside the standard library, on purpose, so
  # this job cannot be taken down by a dependency resolution failure that has nothing to do with
  # documentation.
  citation-anchors:
    name: Citation anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      # Two failure modes, one exit code: a citation that no longer points at the code it claims,
      # and a NEW citation with nothing to check it against. The second is a ratchet against
      # docs/citation_anchor_baseline.txt, so unverifiable citations can only ever fall.
      - name: Verify path:line citations in docs/
        run: python scripts/check_citation_anchors.py

  # Dependency vulnerability scan against the committed uv.lock. Runs independently of the
  # test job (no DB needed) so a CVE advisory never blocks the functional suite and vice versa.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      # TWO INDEPENDENT CHECKS THAT MUST NOT BE ABLE TO DISABLE EACH OTHER.
      #
      # History, because both orderings have already failed here:
      #
      #   1. `uv lock --check` ran first and GATED the scan. The 0.6.0 release bumped
      #      pyproject.toml's version without refreshing uv.lock, so it failed and pip-audit never
      #      ran — CVE scanning was off on every PR, and because the job failed on lockfile drift
      #      rather than on a finding, the red read as a broken build rather than an absent control.
      #
      #   2. Moving the scan first (#89) fixed that and broke the other half: `uv export` WITHOUT
      #      `--frozen` re-resolves and, WHEN THE LOCK IS OUT OF DATE, rewrites uv.lock in the
      #      workspace, so the `uv lock --check` that followed inspected a lock the previous step
      #      had just repaired and always passed. Verified directly — introduce a version drift,
      #      run the export, and the check goes green with the drift still committed.
      #      The conditional is load-bearing and an earlier version of this comment stated it
      #      unconditionally: against a CURRENT lock the export leaves the file byte-identical
      #      (measured — same sha256, same size). So the hazard is invisible in the normal case
      #      and appears exactly when there is drift to hide, which is what makes the ordering
      #      below a control rather than a precaution. See CONTRIBUTING.md, "Reproducing the CVE
      #      scan locally", which must stay in step with this.
      #
      # So the check runs FIRST, before anything can mutate the lock, but `continue-on-error`
      # keeps it from gating anything. The scan then always runs. The job fails at the END on the
      # recorded outcome. Neither control can suppress the other, in either direction, which is
      # the property both previous versions were missing.
      - name: Check the committed lockfile is current
        id: lockcheck
        continue-on-error: true
        run: uv lock --check

      # No `--frozen`: it resolves from pyproject.toml, so a drifted lock cannot stop the scan.
      # The side effect that makes this safe only in THIS position is that it rewrites uv.lock when
      # the lock is drifted (against a current lock it is a no-op on the file) — harmless on a
      # throwaway runner checkout, fatal to the check above if it ran first.
      - name: Export dependencies for scanning
        run: uv export --all-extras --no-emit-project --format requirements-txt -o requirements.lock.txt

      # --no-deps: the exported file already pins the full transitive set, so audit exactly
      # those versions instead of re-resolving. This is a real gate (a known CVE fails CI); if
      # it proves too noisy, add `continue-on-error: true` to downgrade it to advisory.
      - name: Audit dependencies (pip-audit)
        run: uvx pip-audit --requirement requirements.lock.txt --no-deps

      # `always()` so a CVE finding cannot hide lockfile drift either.
      - name: Fail if the lockfile had drifted
        if: always() && steps.lockcheck.outcome == 'failure'
        run: |
          echo "::error::uv.lock has drifted from pyproject.toml. If you changed the version or"
          echo "::error::any dependency, run 'uv lock' and commit the result in the SAME commit."
          echo "::error::A stale lock means the committed pins are not what this project resolves."
          exit 1
