name: Windows installer

# Builds the frozen graphical installer and PROVES IT RUNS.
#
# ⛔ **The `--selftest` step is the reason this workflow is worth having.** A PyInstaller bundle
# fails characteristically: it starts, draws its window, and raises `ModuleNotFoundError` the
# instant somebody presses Install — because PyInstaller finds imports by static analysis and this
# codebase imports lazily nearly everywhere. A workflow that only checked the build succeeded would
# be green for exactly that bundle. `--selftest` reaches the modules the first click reaches.
#
# ⚠️ **It cannot be verified on every developer machine.** Measured 2026-08-21 on the maintainer's
# Windows 11 box: `UsermodeCodeIntegrityPolicyEnforcementStatus: 2`, WDAC enforced, and the freshly
# built unsigned exe was refused outright with "An Application Control policy has blocked this
# file". Not a SmartScreen warning somebody can click past — blocked. A hosted runner has no such
# policy, which makes CI the only place the binary can currently be executed at all.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "packaging/**"
      - "recall/desktop/**"
      - "recall/wizard/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install the package and the build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop,mcp,fastembed,documents]"
          python -m pip install "pyinstaller>=6.10"

      - name: Build
        working-directory: packaging
        run: python -m PyInstaller recall-install.spec --noconfirm --distpath ../dist

      - name: Prove the bundle is complete
        # ⛔ Not `--help`, which exits at argparse before reaching a single lazily imported module.
        # This builds the window off-screen and imports the engine the first click would reach.
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\recall-install\recall-install.exe --selftest

      - name: Report the bundle size
        # A number in the log, because this is a download a person waits for and nothing else in CI
        # would notice it doubling. `collect_submodules("recall")` sweeps in whatever recall grows.
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem -Recurse dist/recall-install | Measure-Object -Property Length -Sum).Sum
          "bundle: {0:N0} MB" -f ($bytes / 1MB)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: recall-install-windows
          path: dist/recall-install
          if-no-files-found: error
