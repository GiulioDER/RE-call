name: OpenRouter Security Review

# Manual only, since 2026-09-26: every review spends OpenRouter credit, and on every PR event it
# drew on the same account as the official AML service. Run it from the Actions tab, or from any
# directory with this, putting the pull request's number in place of 783:
#   gh workflow run openrouter-security.yml --repo GiulioDER/RE-call -f pull_request_number=783
on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to review
        required: true
        type: string

# The workflow checks out only the trusted revision it was dispatched on. It obtains the PR diff
# through the read-only GitHub API, so fork code never runs with OPENROUTER_API_KEY.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: openrouter-security-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  review:
    name: OpenRouter security review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Fetch pull request diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GitHub answers HTTP 406 for a diff over 20,000 lines. That is recorded for the review
          # step to report as NOT REVIEWED; every other failure still fails the job.
          if ! gh api --method GET "repos/$REPOSITORY/pulls/$PR_NUMBER" \
              --header 'Accept: application/vnd.github.v3.diff' \
              > "$RUNNER_TEMP/pr.diff" 2> "$RUNNER_TEMP/pr.diff.err"; then
            if grep -q 'HTTP 406' "$RUNNER_TEMP/pr.diff.err"; then
              cp "$RUNNER_TEMP/pr.diff.err" "$RUNNER_TEMP/pr.diff.unavailable"
              exit 0
            fi
            cat "$RUNNER_TEMP/pr.diff.err" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/pr.diff"

      - name: Review diff with OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'qwen/qwen3-coder-30b-a3b-instruct' }}
          OPENROUTER_FAIL_ON_HIGH: ${{ vars.OPENROUTER_FAIL_ON_HIGH || '0' }}
          PR_DIFF_PATH: ${{ runner.temp }}/pr.diff
          PR_DIFF_UNAVAILABLE_PATH: ${{ runner.temp }}/pr.diff.unavailable
          PR_NUMBER: ${{ inputs.pull_request_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: python .github/scripts/openrouter_security_scan.py
