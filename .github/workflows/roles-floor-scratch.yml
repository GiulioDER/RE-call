name: Two-role and floor scratch
'on':
  push:
    branches:
    - claude/upgrade-two-role-pgvector-floor
permissions:
  contents: read
jobs:
  two-roles:
    name: Two roles (${{ matrix.mutation }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres:
        - 18
        roles:
        - two
        mutation:
        - none
        - skip-regrant
    services:
      db:
        image: pgvector/pgvector:pg${{ matrix.postgres }}
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall
          POSTGRES_DB: recall
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U recall" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RECALL_SERVING_DSN: postgresql://recall:recall@localhost:5432/recall
      RECALL_MIGRATION_DSN: postgresql://recall:recall@localhost:5432/recall
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
    - name: Install the previous release from PyPI
      run: 'set -euo pipefail

        python -m venv "$RUNNER_TEMP/venv"

        "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "recall-rag[mcp]==0.14.0"

        echo "PY=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

        cp scripts/upgrade_smoke.py "$RUNNER_TEMP/"

        '
    - name: Create the unprivileged serving role
      if: matrix.roles == 'two'
      run: "set -euo pipefail\n\"$PY\" -I - <<'EOF'\nimport os, psycopg\nwith psycopg.connect(os.environ[\"RECALL_MIGRATION_DSN\"], autocommit=True) as conn:\n    conn.execute(\"CREATE ROLE recall_server\
        \ LOGIN PASSWORD 'recall_server' NOINHERIT NOBYPASSRLS\")\n    conn.execute(\"GRANT CONNECT ON DATABASE recall TO recall_server\")\n    conn.execute(\"GRANT USAGE ON SCHEMA public TO recall_server\"\
        )\n    conn.execute(\"REVOKE CREATE ON SCHEMA public FROM recall_server\")\nEOF\necho \"RECALL_SERVING_DSN=postgresql://recall_server:recall_server@localhost:5432/recall\" >> \"$GITHUB_ENV\"\necho\
        \ \"UPGRADE_SMOKE_SERVING_ROLE=recall_server\" >> \"$GITHUB_ENV\"\n"
    - name: Seed the database with 0.14.0
      working-directory: ${{ runner.temp }}
      run: '"$PY" -I upgrade_smoke.py seed --workdir "$RUNNER_TEMP/upgrade"'
    - name: Build the wheel from this commit
      run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
    - name: Install it over the same venv
      run: 'set -euo pipefail

        wheel=$(ls "$RUNNER_TEMP"/dist/*.whl)

        # Until the release bump the wheel carries the same version number as the PyPI

        # release, so `--upgrade` alone would keep the old files. Replace the package, then

        # let pip add whatever dependencies the new one needs.

        "$PY" -m pip install --quiet --force-reinstall --no-deps "$wheel"

        "$PY" -m pip install --quiet "${wheel}[mcp]"

        "$PY" -I -c "import recall; print(recall.__version__, recall.__file__)"

        '
    - name: Upgrade and verify with the new wheel
      working-directory: ${{ runner.temp }}
      run: '"$PY" -I upgrade_smoke.py verify --workdir "$RUNNER_TEMP/upgrade"'
      env:
        UPGRADE_SMOKE_SKIP_REGRANT: ${{ matrix.mutation == 'skip-regrant' && '1' || '0' }}
  floor:
    name: Floor (${{ matrix.mutation }})
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.7.4-pg17
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall
          POSTGRES_DB: recall
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U recall" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RECALL_SERVING_DSN: postgresql://recall:recall@localhost:5432/recall
      RECALL_MIGRATION_DSN: postgresql://recall:recall@localhost:5432/recall
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
    - name: Apply 0.14.0's schema on pgvector 0.7.4
      run: 'set -euo pipefail

        python -m venv "$RUNNER_TEMP/venv"

        "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "recall-rag==0.14.0"

        echo "PY=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

        cp scripts/upgrade_smoke.py "$RUNNER_TEMP/"

        "$RUNNER_TEMP/venv/bin/recall" --embedder hashing schema apply

        '
    - name: Build the wheel and install it over the same venv
      run: 'set -euo pipefail

        uv build --wheel --out-dir "$RUNNER_TEMP/dist"

        wheel=$(ls "$RUNNER_TEMP"/dist/*.whl)

        "$PY" -m pip install --quiet --force-reinstall --no-deps "$wheel"

        "$PY" -m pip install --quiet "$wheel"

        '
    - name: RED, lower the floor in the installed wheel
      if: matrix.mutation == 'floor-0.7'
      run: 'site=$("$PY" -I -c "import recall, pathlib; print(pathlib.Path(recall.__file__).parent)")

        sed -i "s/^PGVECTOR_MIN_VERSION = (0, 8, 0)/PGVECTOR_MIN_VERSION = (0, 7, 0)/" "$site/schema.py"

        grep -n "^PGVECTOR_MIN_VERSION" "$site/schema.py"

        '
    - name: The upgrade refuses before migrating
      working-directory: ${{ runner.temp }}
      run: '"$PY" -I upgrade_smoke.py floor --workdir "$RUNNER_TEMP/floor"'
    strategy:
      fail-fast: false
      matrix:
        mutation:
        - none
        - floor-0.7
